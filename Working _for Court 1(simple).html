<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Court 1 — TB1-SAFE (Names & Hours + DUPR)</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body{
      margin:0; padding:0; width:100vw; height:100vh;
      overflow:hidden; background:transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ===== BAR ===== */
    .bar{
      position:fixed; left:0; right:0; bottom:0; height:72px;
      display:grid; grid-template-columns:1.2fr 2.2fr 1.1fr 2.1fr 1.2fr;
      gap:4px; padding:8px 12px; box-sizing:border-box;
      transition: background 400ms ease;
      background:linear-gradient(90deg,#14203a,#22335d 70%);
    }
    .bar.red{ background:linear-gradient(90deg,#4a0000,#c02020 70%); }

    /* Skill gradient uses vars set by JS */
    .bar.skill{
      background:linear-gradient(90deg,var(--skillA,#14203a),var(--skillB,#22335d) 70%);
    }

    .sec{
      position:relative; display:flex; flex-direction:column;
      justify-content:center; align-items:center;
      overflow:hidden; border-radius:6px;
    }
    .sec:not(#cn)::before{
      content:""; position:absolute; left:3px; right:3px; top:3px; bottom:3px;
      background:#000; opacity:.78; border-radius:6px;
    }

    .label{ font-weight:700; text-transform:uppercase; font-size:10px; letter-spacing:.08em; z-index:1; margin-bottom:1px; color:#d4e5fd; }
    #cur .label{ color:#6cff6c; }
    #nxt .label{ color:#ffe56b; }

    .val{ font-weight:800; z-index:1; text-align:center; line-height:1.08; color:#fff; padding:0 6px; }
    #cur .val, #nxt .val{ font-size:14px; white-space:normal; overflow-wrap:anywhere; word-break:break-word; }
    #cd .val{ font-size:20px; }
    #now .val{ font-size:16px; }

    #cn{ transition: background 400ms ease; }
    #cn.alert::before{ content:""; position:absolute; left:3px; right:3px; top:3px; bottom:3px; background:linear-gradient(180deg,#4a0000,#a80000); opacity:.65; border-radius:10px; }
    #cn .val{ position:relative; font-size:58px; font-weight:900; padding:2px 12px; border:3px solid #fff; border-radius:10px; text-shadow:0 1px 2px rgba(0,0,0,.4); transition: border-color 300ms ease; }

    .pulse-blue { animation: pulseBlue 2.8s ease-in-out infinite; }
    @keyframes pulseBlue { 0%,100%{ border-color:#ffffff; } 50%{ border-color:#7fbfff; } }
    .pulse-red { animation: pulseRed 2.2s ease-in-out infinite; }
    @keyframes pulseRed { 0%,100%{ border-color:#ffffff; } 50%{ border-color:#ff5a5a; } }

    .expired-msg { font-size:28px; color:#ff4444; font-weight:900; }
    .meta{ font-size:12px; color:#d8d8d8; font-weight:400; margin-top:2px; }

    #infoOverlay{ position:fixed; top:0; left:0; right:0; bottom:0; z-index:9999; background:rgba(0,0,0,.82); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 800ms ease; }
    #infoOverlay.active{ opacity:1; pointer-events:auto; }

    .overlayBox{
      background-color:#0c0c0c;
      border-radius:30px;
      padding:45px 80px 55px 80px;
      max-width:80%;
      text-align:center;
      color:#fff;
      transform:scale(.82);
      box-shadow: 0 0 15px rgba(0,140,255,.55), 0 0 60px rgba(60,120,255,.35);
    }
    #infoOverlay.active .overlayBox{ animation: popIn .9s cubic-bezier(.18,.89,.32,1) forwards, glowPulse 2.8s ease-in-out infinite; }

    .overlayLogo{ display:block; margin:0 auto 12px auto; max-width:420px; max-height:120px; }

    /* DUPR level line (shows only when detected) */
    .overlayLevel{
      font-size:56px;
      font-weight:900;
      margin:16px 0;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#000;
      display:none;
    }

    .overlayBody{ font-size:30px; line-height:1.25; font-weight:700; margin-top:10px; }

    @keyframes popIn{ 0%{ transform:scale(.7); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
    @keyframes glowPulse{ 0%,100%{ box-shadow: 0 0 15px rgba(0,140,255,.55); } 50%{ box-shadow: 0 0 40px rgba(0,180,255,.8); } }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <div id="cn" class="sec"><div class="val pulse-blue" id="cno">1</div></div>
    <div id="cur" class="sec"><div class="label">In Progress</div><div class="val" id="curv">Loading...</div></div>
    <div id="cd" class="sec"><div class="label" id="cdlbl">Time Left</div><div class="val" id="cdv">--</div></div>
    <div id="nxt" class="sec"><div class="label">Upcoming</div><div class="val" id="nxtv">Loading next...</div></div>
    <div id="now" class="sec"><div class="label">Current Time</div><div class="val" id="clock">--:--</div></div>
  </div>

  <div id="infoOverlay">
    <div class="overlayBox" id="overlayBox">
      <img src="levelup-logo.png" alt="LevelUp Pickleball" class="overlayLogo">
      <div class="overlayLevel" id="overlayLevel"></div>
      <div class="overlayBody" id="overlayBody">Loading...</div>
    </div>
  </div>

<script>
(function(){
  var COURT_NO   = 1;
  var TZ         = "America/New_York";
  var PROXY_BASE = "https://courtreserve-proxy.s-jackson.workers.dev/api/day";

  var cdTimer = null, cdMode = "none", cdTarget = null;

  // DUPR / skill state
  var currentLevelLabel = "";
  var currentLevelBg    = "#0c0c0c";
  var currentIsSkill    = false;

  function toLocalNY(d){
    return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true, timeZone: TZ });
  }

  function parseTimeAny(t){
    if(!t) return null;
    var d = new Date(t);
    return isNaN(d.getTime()) ? null : d;
  }

  function pickArray(c){
    if(!c) return [];
    return Array.isArray(c) ? c : (c.Data || c.data || []);
  }

  function containsCourtN(rec, n){
    // NOTE: This is your "stable" matcher. If you want it stronger later, we can,
    // but keeping it simple helps TB1 stability.
    var s = JSON.stringify(rec).toLowerCase();
    return s.indexOf("court #"+n) >= 0 || s.indexOf("court "+n) >= 0 || s.indexOf("courts "+n) >= 0;
  }

  function setPulse(mode){
    var el = document.getElementById('cno');
    el.className = "val " + (mode === "red" ? "pulse-red" : "pulse-blue");
  }

  function darkenHex(hex, pct){
    var h = String(hex||"").replace("#","");
    if(h.length===3){ h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    if(h.length!==6) return hex;
    var r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
    r=Math.max(0, Math.floor(r*(1-pct)));
    g=Math.max(0, Math.floor(g*(1-pct)));
    b=Math.max(0, Math.floor(b*(1-pct)));
    return "#"+("0"+r.toString(16)).slice(-2)+("0"+g.toString(16)).slice(-2)+("0"+b.toString(16)).slice(-2);
  }

  function setBarMode(mode){
    var bar = document.getElementById('bar'), cn = document.getElementById('cn');

    if(mode === "red"){
      bar.className = "bar red";
      cn.className = "sec alert";
      return;
    }

    cn.className = "sec";

    if(mode === "skill" && currentIsSkill){
      bar.style.setProperty("--skillB", currentLevelBg || "#22335d");
      bar.style.setProperty("--skillA", darkenHex(currentLevelBg || "#22335d", 0.28));
      bar.className = "bar skill";
      return;
    }

    bar.className = "bar";
  }

  // ===== DUPR / Skill parsing from title =====
  function getLevelInfoFromTitle(title){
    var t = (title || "");
    var tLow  = t.toLowerCase();
    var tNorm = tLow.replace(/\s+/g,"").replace(/–/g,"-").replace(/—/g,"-");

    var info = { label:"", bg:"#0c0c0c", isSkill:false };

    // exact numeric bands
    if (tNorm.indexOf("4.5+") >= 0 || tNorm.indexOf("4.5-") >= 0 || tNorm.indexOf("5.0") >= 0){
      info.label = "4.5+";
      info.bg    = "#cfd829";
      info.isSkill = true;
    } else if (tNorm.indexOf("4.0-4.4")>=0 || tNorm.indexOf("4.0-4.49")>=0 || tNorm.indexOf("4.0-4.5")>=0){
      info.label = "4.0–4.49";
      info.bg    = "#f47855";
      info.isSkill = true;
    } else if (tNorm.indexOf("3.5-3.9")>=0 || tNorm.indexOf("3.5-3.99")>=0 || tNorm.indexOf("3.5+")>=0){
      info.label = "3.5–3.99";
      info.bg    = "#ee3c85";
      info.isSkill = true;
    } else if (tNorm.indexOf("3.0-3.4")>=0 || tNorm.indexOf("3.0-3.49")>=0){
      info.label = "3.0–3.49";
      info.bg    = "#15803d";
      info.isSkill = true;
    } else if (tNorm.indexOf("2.0-2.9")>=0 || tNorm.indexOf("2.0-2.99")>=0){
      info.label = "2.0–2.99";
      info.bg    = "#0ea5e9";
      info.isSkill = true;
    } else {
      // keywords (optional fallback)
      if(tLow.indexOf("advanced") >= 0){
        info.label = "4.5+";
        info.bg    = "#cfd829";
        info.isSkill = true;
      } else if(tLow.indexOf("intermediate+") >= 0){
        info.label = "3.5–3.99";
        info.bg    = "#6d28d9";
        info.isSkill = true;
      } else if(tLow.indexOf("intermediate") >= 0){
        info.label = "3.0–3.49";
        info.bg    = "#15803d";
        info.isSkill = true;
      } else if(tLow.indexOf("beginner") >= 0){
        info.label = "2.0–2.99";
        info.bg    = "#0ea5e9";
        info.isSkill = true;
      }
    }
    return info;
  }

  function applySkillFromName(name){
    var info = getLevelInfoFromTitle(name || "");
    currentLevelLabel = info.label;
    currentLevelBg    = info.bg;
    currentIsSkill    = !!info.isSkill;
  }

  function applyOverlayLevelStyles(){
    var box = document.getElementById("overlayBox");
    var lvl = document.getElementById("overlayLevel");
    if(!box || !lvl) return;

    if(currentIsSkill && currentLevelLabel){
      lvl.style.display = "block";
      lvl.textContent   = currentLevelLabel;
      box.style.backgroundColor = currentLevelBg || "#0c0c0c";
    } else {
      lvl.style.display = "none";
      lvl.textContent   = "";
      box.style.backgroundColor = "#0c0c0c";
    }
  }

  function shortName(p){
    var fn = (p.FirstName||"").trim(), ln = (p.LastName||"").trim();
    var init = fn ? fn.charAt(0).toUpperCase() + "." : "";
    return (init && ln) ? (init + " " + ln) : (init || ln || "");
  }

  function startCountdown(targetMs, mode){
    cdTarget = targetMs; cdMode = mode||"none";
    if(cdTimer) clearInterval(cdTimer);

    cdTimer = setInterval(function(){
      var diff = cdTarget - Date.now();
      var out = document.getElementById('cdv'), lbl = document.getElementById('cdlbl');

      if(diff > 0){
        if(cdMode === "cur" && diff <= 60000){
          setPulse("red");
          setBarMode("red");
          out.className = "val";
          out.textContent = Math.floor(diff/1000) + "s";
        } else {
          setPulse("blue");
          setBarMode(currentIsSkill ? "skill" : "blue");

          out.className = "val";
          var totalMin = Math.floor(diff/60000);
          if(totalMin >= 60){
            out.textContent = Math.floor(totalMin/60) + "h " + (totalMin%60) + "m";
          } else {
            out.textContent = totalMin + "m";
          }
        }
        lbl.textContent = (cdMode === "cur") ? "Time Left" : "Time Until";
      } else {
        if(cdMode === "cur") {
          out.textContent = "TIME EXPIRED";
          out.className = "val expired-msg";
          setPulse("red");
          setBarMode("red");
        } else {
          refresh();
        }
      }
    }, 1000);
  }

  function refresh(){
    var url = PROXY_BASE + "?court=" + COURT_NO + "&r=" + Date.now();
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.onreadystatechange = function(){
      if(x.readyState === 4 && x.status === 200){
        var data = JSON.parse(x.responseText);
        var all = [];
        var ev = pickArray(data.events), rs = pickArray(data.reservations);

        ev.concat(rs).forEach(function(item){
          var s = parseTimeAny(item.StartTime || item.StartDateTime);
          var e = parseTimeAny(item.EndTime   || item.EndDateTime);

          // keep your original “stable” canceled flag check
          if(s && e && containsCourtN(item, COURT_NO) && !item.IsCanceled){
            var name = "";
            if(item.Players && item.Players.length){
              name = item.Players.map(shortName).join(", ");
            }
            if(!name) name = item.EventName || item.Name || item.ReservationTypeName || "Reserved";
            all.push({name: name, start: s, end: e});
          }
        });

        all.sort(function(a,b){ return a.start - b.start; });

        var now = new Date(), cur = null, nxt = null;
        all.forEach(function(i){
          if(now >= i.start && now <= i.end) cur = i;
          else if(!nxt && now < i.start) nxt = i;
        });

        // Apply skill mode based on CURRENT event name (only)
        if(cur && cur.name){
          applySkillFromName(cur.name);
        } else {
          currentLevelLabel = "";
          currentLevelBg    = "#0c0c0c";
          currentIsSkill    = false;
        }

        // Render
        document.getElementById('curv').innerHTML = cur
          ? cur.name + "<div class='meta'>" + toLocalNY(cur.start) + " - " + toLocalNY(cur.end) + "</div>"
          : "No current event";

        document.getElementById('nxtv').innerHTML = nxt
          ? nxt.name + "<div class='meta'>" + toLocalNY(nxt.start) + " - " + toLocalNY(nxt.end) + "</div>"
          : "No upcoming event";

        // Set base bar mode immediately (countdown will override to red near end)
        setBarMode(currentIsSkill ? "skill" : "blue");

        if(cur) startCountdown(cur.end.getTime(), "cur");
        else if(nxt) startCountdown(nxt.start.getTime(), "next");
      }
    };
    x.send();
  }

  function showOverlay(){
    document.getElementById("overlayBody").innerHTML = document.getElementById("curv").innerHTML;
    applyOverlayLevelStyles();
    document.getElementById("infoOverlay").classList.add("active");
    setTimeout(function(){ document.getElementById("infoOverlay").classList.remove("active"); }, 10000);
  }

  // clock
  setInterval(function(){ document.getElementById('clock').textContent = toLocalNY(new Date()); }, 1000);

  // init
  refresh();
  setInterval(refresh, 30000);

  // overlay on-the-minute
  setTimeout(function(){
    showOverlay();
    setInterval(showOverlay, 60000);
  }, (60 - (new Date()).getSeconds()) * 1000);
})();
</script>
</body>
</html>
